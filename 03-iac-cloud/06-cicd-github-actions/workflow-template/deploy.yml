name: Deploy to AWS

# Runs on push to your student branch.
# Replace YOUR-BRANCH with the branch you set in terraform.tfvars (github_branch).

on:
  push:
    branches:
      - YOUR-BRANCH
    paths:
      - "01-containers/07-debugging/backend/**"
      - "01-containers/07-debugging/frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write       # required for OIDC
  contents: read

env:
  AWS_REGION: eu-central-1
  STUDENT_NAME: YOUR-NAME-HERE   # e.g. dren-sokoli

jobs:
  build-and-push:
    name: Build, Push to ECR, Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::ACCOUNT-ID:role/life-gh-deploy-YOUR-NAME-HERE
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: life-backend-${{ env.STUDENT_NAME }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPO:$TAG -t $REGISTRY/$REPO:latest \
            ./01-containers/07-debugging/backend
          docker push $REGISTRY/$REPO:$TAG
          docker push $REGISTRY/$REPO:latest

      - name: Build & push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: life-frontend-${{ env.STUDENT_NAME }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPO:$TAG -t $REGISTRY/$REPO:latest \
            ./01-containers/07-debugging/frontend
          docker push $REGISTRY/$REPO:$TAG
          docker push $REGISTRY/$REPO:latest

      - name: Find EC2 instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Owner,Values=${{ env.STUDENT_NAME }}" \
                      "Name=tag:Lab,Values=05-compute-storage" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found EC2: $INSTANCE_ID"

      - name: Trigger redeploy via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          BACKEND_IMAGE: ${{ steps.ecr.outputs.registry }}/life-backend-${{ env.STUDENT_NAME }}:latest
          FRONTEND_IMAGE: ${{ steps.ecr.outputs.registry }}/life-frontend-${{ env.STUDENT_NAME }}:latest
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.ec2.outputs.instance_id }} \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters commands='[
              "sudo -u ec2-user /home/ec2-user/ecr-login.sh",
              "docker pull '"$BACKEND_IMAGE"'",
              "docker pull '"$FRONTEND_IMAGE"'",
              "docker rm -f backend frontend 2>/dev/null || true",
              "docker run -d --name backend --restart unless-stopped -p 8080:8080 -e ASPNETCORE_URLS=http://+:8080 -e ConnectionStrings__Default=\"$RDS_CONN\" '"$BACKEND_IMAGE"'",
              "docker run -d --name frontend --restart unless-stopped -p 3000:3000 '"$FRONTEND_IMAGE"'"
            ]' \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command: $COMMAND_ID"

          # Poll for completion
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id ${{ steps.ec2.outputs.instance_id }} \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ]; then
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id ${{ steps.ec2.outputs.instance_id }}
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for SSM command"
          exit 1

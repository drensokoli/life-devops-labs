services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: life
      POSTGRES_PASSWORD: life2026
      POSTGRES_DB: lifedb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life -d lifedb"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=lifedb;Username=life;Password=life2026"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend

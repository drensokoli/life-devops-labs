name: life-fullstack

services:

  # ─────────────────────────── Database ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: life-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - life-net

  # ─────────────────────────── Cache ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: life-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - life-net

  # ─────────────────────────── Messaging ──────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: life-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - life-net

  # KRaft mode — no ZooKeeper needed
  kafka:
    image: apache/kafka:3.7.1
    container_name: life-kafka
    environment:
      KAFKA_NODE_ID:                        "1"
      KAFKA_PROCESS_ROLES:                  broker,controller
      KAFKA_LISTENERS:                      PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID:                           MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - life-net

  # ─────────────────────────── Identity ───────────────────────────
  # start-dev skips TLS and hostname validation — fine for local lab
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: life-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS}
    ports:
      - "8180:8080" # Keycloak default internal port is 8080; exposed as 8180
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - life-net

  # ─────────────────────────── Observability ──────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: life-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - life-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: life-grafana
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - life-net

  # ─────────────────────────── Application ────────────────────────
  backend:
    build:
      context: ../07-debugging/backend
      dockerfile: Dockerfile
    container_name: life-backend
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - life-net

  # NEXT_PUBLIC_API_URL is baked into the JS bundle at build time.
  # Using the host-mapped backend port so the browser can reach it
  # both directly (localhost:3000) and through nginx (localhost:80).
  frontend:
    build:
      context: ../07-debugging/frontend
      dockerfile: Dockerfile.k8s
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: life-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - life-net

  # ─────────────────────────── Reverse Proxy ──────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: life-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - life-net

# ───────────────────────────── Volumes / Networks ────────────────
volumes:
  postgres_data:
  grafana_data:

networks:
  life-net:
    driver: bridge

events {
    worker_connections 1024;
}

http {
    # Upstreams reference the docker-compose service names; Docker's embedded
    # DNS resolves them to the containers on the shared network.
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;

        # API traffic goes to the .NET backend. This is a longer prefix than
        # "/" so nginx matches it first. proxy_pass has no trailing path, so
        # the full original URI (/api/...) is forwarded unchanged — the
        # backend already serves its routes under /api/*.
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else (the UI and its /_next static assets) goes to the
        # Next.js frontend.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

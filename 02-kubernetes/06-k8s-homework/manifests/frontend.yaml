apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: life-app
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: life-frontend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            # NEXT_PUBLIC_* is baked at build time; this runtime value has no
            # effect on the browser bundle (kept to satisfy the spec).
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend-service"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: life-app
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP

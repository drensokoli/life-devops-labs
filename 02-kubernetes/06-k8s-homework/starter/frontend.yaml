# TODO: Write a complete Deployment + Service for the Next.js frontend
#
# Requirements:
# - Deployment name: frontend
# - Namespace: life-app
# - Replicas: 2
# - Image: life-frontend:1.0.0 (imagePullPolicy: Never)
# - Container port: 3000
# - Environment variable: NEXT_PUBLIC_API_URL = "http://backend-service"
# - Liveness probe: httpGet / port 3000, initialDelaySeconds 10, periodSeconds 30
# - Readiness probe: httpGet / port 3000, initialDelaySeconds 5, periodSeconds 10
# - Resource requests: memory 128Mi, cpu 250m
# - Resource limits: memory 256Mi, cpu 500m
# - Labels: app: frontend
#
# Service requirements:
# - Service name: frontend-service
# - Type: ClusterIP
# - Port: 80 → targetPort: 3000
# - Selector: app: frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: life-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: life-frontend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend-service"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: life-app
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP

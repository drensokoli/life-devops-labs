# TODO: Write a complete Deployment + Service for the .NET backend
#
# Requirements:
# - Deployment name: backend
# - Namespace: life-app
# - Replicas: 2
# - Image: life-backend:1.0.0 (imagePullPolicy: Never)
# - Container port: 8080
# - envFrom: app-config (configMapRef) + db-credentials (secretRef)
# - Liveness probe: httpGet /health port 8080, initialDelaySeconds 15, periodSeconds 30
# - Readiness probe: httpGet /health port 8080, initialDelaySeconds 10, periodSeconds 10
# - Resource requests: memory 128Mi, cpu 250m
# - Resource limits: memory 512Mi, cpu 500m
# - Rolling update strategy: maxUnavailable 1, maxSurge 1
# - Labels: app: backend
#
# Service requirements:
# - Service name: backend-service
# - Type: ClusterIP
# - Port: 80 → targetPort: 8080
# - Selector: app: backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: life-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: life-backend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-credentials
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: life-app
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
